server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html htm;
        image/png               png;
        image/svg+xml           svg svgz;
        application/json        json;
        font/woff2              woff2;
        font/woff               woff;
        application/wasm        wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
